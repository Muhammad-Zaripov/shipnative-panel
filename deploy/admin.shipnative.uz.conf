# Admin website: static files from /var/www/shipnative-admin (see deploy/deploy.sh).
# Installed into /etc/nginx/sites-available/admin.shipnative.uz.conf (+ symlink in sites-enabled), then
# certbot --nginx -d admin.shipnative.uz --redirect adds the TLS block to the installed copy.
server {
    listen 80;
    listen [::]:80;
    server_name admin.shipnative.uz;

    root /var/www/shipnative-admin;
    index index.html;

    # The back office must never be framed, indexed or talk to anything but the API.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.shipnative.uz; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
